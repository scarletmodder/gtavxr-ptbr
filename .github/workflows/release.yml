name: Release

# Builds and tests the installer on every pull request and on every push to main.
# A push to main also publishes a release when GtavxrPtbr.csproj carries a version that has
# no tag yet. To release: raise the version and add docs/releases/vX.Y.Z.md in a pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read the version and decide whether this run publishes
        id: version
        shell: pwsh
        run: |
          $project = Get-Content -Raw src/GtavxrPtbr/GtavxrPtbr.csproj
          if ($project -notmatch '<Version>(\d+\.\d+\.\d+)</Version>') { throw 'No <Version>X.Y.Z</Version> in GtavxrPtbr.csproj' }
          $version = $Matches[1]
          $tag = "v$version"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the tags' }
          $isNew = -not $existing
          if ($isNew -and -not (Test-Path -LiteralPath "docs/releases/$tag.md")) { throw "The release notes docs/releases/$tag.md are missing" }
          $publish = $isNew -and $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, new: $isNew, publish: $publish"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version="6.7.1" --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco could not install Inno Setup' }
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build.ps1
      # Installs for real for the runner's user (no GTAVXR there, so nothing is translated),
      # runs the installed tool, uninstalls and checks that nothing is left behind.
      - name: Test the installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = "dist/GTAVXR-PTBR-Setup-v$version.exe"
          $target = Join-Path $env:LOCALAPPDATA 'Programs\GTAVXR PT-BR'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=en' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The installer ended with code $($install.ExitCode)" }
          foreach ($file in 'GtavxrPtbr.exe', 'Mono.Cecil.dll', 'translations\suite.pt-BR.json', 'translations\content-catalog.pt-BR.json', 'LICENSE.txt', 'THIRD-PARTY-NOTICES.md', 'unins000.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $target $file))) { throw "$file was not installed" }
          }
          $tool = Join-Path $target 'GtavxrPtbr.exe'
          $reported = & $tool --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne $version) { throw "The installed tool reports '$reported', expected $version" }
          & $tool status
          if ($LASTEXITCODE -ne 0) { throw 'The installed tool failed its status command' }
          $remove = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "The uninstaller ended with code $($remove.ExitCode)" }
          foreach ($attempt in 1..20) {
            if (-not (Test-Path -LiteralPath $tool)) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $tool) { throw 'The uninstaller left the tool behind' }
      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          $sums = (Get-Content -Raw dist/SHA256SUMS.txt).Trim()
          $body = (Get-Content -Raw -Encoding utf8 "docs/releases/$tag.md").TrimEnd() + "`n`n## 🔒 Checksum (SHA-256)`n`n``````text`n$sums`n```````n"
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/notes.md'), $body)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/GTAVXR-PTBR-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/notes.md

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: package
      - name: Check the package and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd package
          ls -l
          test "$(ls | LC_ALL=C sort | tr '\n' ' ')" = "GTAVXR-PTBR-Setup-v$VERSION.exe SHA256SUMS.txt notes.md "
          sha256sum --check SHA256SUMS.txt
          gh release create "v$VERSION" "GTAVXR-PTBR-Setup-v$VERSION.exe" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GTAVXR PT-BR v$VERSION" --notes-file notes.md
